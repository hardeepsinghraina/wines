apiVersion: v1
kind: ConfigMap
metadata:
  name: luxurywines-config
  namespace: luxurywines-production
data:
  NODE_ENV: "production"
  PORT: "5000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  CORS_ORIGIN: "https://luxurywines.com,https://www.luxurywines.com"
  TRUST_PROXY: "true"
  SESSION_SECURE: "true"
  SESSION_SAME_SITE: "strict"
  ENABLE_NFT_FEATURES: "true"
  ENABLE_PRIVATE_SALES: "true"
  ENABLE_AFFILIATE_PROGRAM: "true"
  ENABLE_LOYALTY_PROGRAM: "true"
  HEALTH_CHECK_ENDPOINT: "/health"
  HEALTH_CHECK_TIMEOUT: "5000"
  MAX_REQUEST_SIZE: "10mb"
  REQUEST_TIMEOUT: "30000"
  KEEP_ALIVE_TIMEOUT: "65000"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_SKIP_SUCCESSFUL_REQUESTS: "true"
  DATABASE_SSL: "true"
  DATABASE_POOL_SIZE: "20"
  DATABASE_CONNECTION_TIMEOUT: "30000"
  REDIS_DB: "0"
  REDIS_MAX_RETRIES: "3"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  JWT_ISSUER: "luxurywines.com"
  JWT_AUDIENCE: "luxurywines-api"
  BCRYPT_ROUNDS: "12"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  FROM_EMAIL: "noreply@luxurywines.com"
  FROM_NAME: "Luxury Wines"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "luxurywines-production"
  AWS_CLOUDFRONT_DOMAIN: "cdn.luxurywines.com"
  BACKUP_SCHEDULE: "0 2 * * *"
  BACKUP_RETENTION_DAYS: "30"
  BACKUP_S3_BUCKET: "luxurywines-backups"
  SESSION_MAX_AGE: "86400000"