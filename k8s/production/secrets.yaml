apiVersion: v1
kind: Secret
metadata:
  name: luxurywines-secrets
  namespace: luxurywines-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://username:password@production-db-host:5432/luxurywines_prod"
  REDIS_URL: "redis://production-redis-host:6379"
  REDIS_PASSWORD: "your-redis-password-here"
  JWT_SECRET: "your-super-secure-jwt-secret-256-bits-minimum"
  ENCRYPTION_KEY: "your-32-character-encryption-key-here"
  SMTP_PASS: "your-sendgrid-api-key-here"

  COINBASE_API_KEY: "your-coinbase-api-key-here"
  COINBASE_API_SECRET: "your-coinbase-api-secret-here"
  BITPAY_API_TOKEN: "your-bitpay-api-token-here"
  COINGATE_API_TOKEN: "your-coingate-api-token-here"
  ETHEREUM_RPC_URL: "https://mainnet.infura.io/v3/your-infura-key"
  BITCOIN_RPC_URL: "https://your-bitcoin-node-url"
  SOLANA_RPC_URL: "https://api.mainnet-beta.solana.com"
  FEDEX_API_KEY: "your-fedex-api-key-here"
  UPS_API_KEY: "your-ups-api-key-here"
  DHL_API_KEY: "your-dhl-api-key-here"
  AWS_ACCESS_KEY_ID: "your-aws-access-key-here"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key-here"
  SENTRY_DSN: "https://your-sentry-dsn-here"
  SESSION_SECRET: "your-session-secret-here"
  ADMIN_EMAIL: "admin@luxurywines.com"
  ADMIN_PASSWORD: "your-secure-admin-password-here"
  RECAPTCHA_SECRET_KEY: "your-recaptcha-secret-key-here"