<!DOCTYPE html>
<html>
<head>
    <title>Test Product Fetch</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Product Fetch Test</h1>
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:5000';
        const resultsDiv = document.getElementById('results');

        async function testEndpoint(name, url) {
            const testDiv = document.createElement('div');
            testDiv.className = 'test';
            testDiv.innerHTML = `<h3>${name}</h3><p>Testing: ${url}</p>`;
            resultsDiv.appendChild(testDiv);

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                testDiv.className += ' success';
                testDiv.innerHTML += `
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Success:</strong> ${data.success}</p>
                    <p><strong>Wines Count:</strong> ${data.data?.wines?.length || 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                testDiv.className += ' error';
                testDiv.innerHTML += `<p><strong>Error:</strong> ${error.message}</p>`;
            }
        }

        // Run tests
        (async () => {
            await testEndpoint('All Products (limit 5)', `${API_BASE}/api/products?limit=5`);
            await testEndpoint('Search: Red', `${API_BASE}/api/products?search=Red&limit=5`);
            await testEndpoint('Search: White', `${API_BASE}/api/products?search=White&limit=5`);
            await testEndpoint('Search: Champagne', `${API_BASE}/api/products?search=Champagne&limit=5`);
            await testEndpoint('Category: Red Wine', `${API_BASE}/api/products?category=Red%20Wine&limit=5`);
            await testEndpoint('Category: Champagne', `${API_BASE}/api/products?category=Champagne&limit=5`);
        })();
    </script>
</body>
</html>
